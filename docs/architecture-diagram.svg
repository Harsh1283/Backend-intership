<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="780" viewBox="0 0 1000 780" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/>
    </marker>
  </defs>

  <!-- Legend -->
  <line x1="660" y1="70" x2="700" y2="70" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-slate)"/>
  <text x="712" y="74" font-size="13" fill="#475569">HTTP (synchronous)</text>
  <line x1="660" y1="96" x2="700" y2="96" stroke="#ea580c" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-orange)"/>
  <text x="712" y="100" font-size="13" fill="#9a3412">AMQP event (asynchronous)</text>

  <!-- Client -->
  <rect x="40" y="60" width="150" height="60" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="115" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#334155">Client</text>
  <text x="115" y="106" text-anchor="middle" font-size="11" fill="#64748b">curl / Postman</text>

  <!-- API Gateway -->
  <rect x="430" y="60" width="170" height="80" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="515" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#78350f">API Gateway</text>
  <text x="515" y="112" text-anchor="middle" font-size="11" fill="#b45309">:4000 · helmet, JWT, rate-limit</text>
  <text x="515" y="126" text-anchor="middle" font-size="10" fill="#b45309">proxy only — no business logic</text>

  <!-- User Service -->
  <rect x="120" y="320" width="220" height="72" rx="8" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/>
  <text x="230" y="352" text-anchor="middle" font-size="15" font-weight="bold" fill="#0c4a6e">User Service</text>
  <text x="230" y="372" text-anchor="middle" font-size="11" fill="#075985">:4001 · signup / login / me</text>

  <!-- Notification Service -->
  <rect x="660" y="320" width="220" height="72" rx="8" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/>
  <text x="770" y="352" text-anchor="middle" font-size="15" font-weight="bold" fill="#0c4a6e">Notification Service</text>
  <text x="770" y="372" text-anchor="middle" font-size="11" fill="#075985">:4002 · welcome emails (simulated)</text>

  <!-- RabbitMQ -->
  <rect x="375" y="470" width="250" height="210" rx="8" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="500" y="498" text-anchor="middle" font-size="15" font-weight="bold" fill="#7c2d12">RabbitMQ</text>
  <text x="500" y="514" text-anchor="middle" font-size="11" fill="#c2410c">exchange: user_events (direct, durable)</text>

  <rect x="410" y="530" width="180" height="38" rx="6" fill="#ffedd5" stroke="#f97316" stroke-width="1.5"/>
  <text x="500" y="548" text-anchor="middle" font-size="12" font-weight="bold" fill="#7c2d12">user_events</text>
  <text x="500" y="562" text-anchor="middle" font-size="9" fill="#9a3412">live queue · durable</text>

  <rect x="410" y="578" width="180" height="38" rx="6" fill="#fecaca" stroke="#ef4444" stroke-width="1.5"/>
  <text x="500" y="596" text-anchor="middle" font-size="12" font-weight="bold" fill="#7f1d1d">user_events_dlq</text>
  <text x="500" y="610" text-anchor="middle" font-size="9" fill="#991b1b">dead-letter queue</text>

  <text x="500" y="638" text-anchor="middle" font-size="10" fill="#9a3412">DLX: user_events_dlx</text>
  <text x="500" y="652" text-anchor="middle" font-size="10" fill="#9a3412">failed messages are re-routed here</text>

  <!-- MongoDB -->
  <rect x="120" y="700" width="220" height="56" rx="8" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
  <text x="230" y="726" text-anchor="middle" font-size="15" font-weight="bold" fill="#064e3b">MongoDB</text>
  <text x="230" y="744" text-anchor="middle" font-size="11" fill="#047857">user_service DB</text>

  <rect x="660" y="700" width="220" height="56" rx="8" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
  <text x="770" y="726" text-anchor="middle" font-size="15" font-weight="bold" fill="#064e3b">MongoDB</text>
  <text x="770" y="744" text-anchor="middle" font-size="11" fill="#047857">notification_service DB</text>

  <!-- Client -> Gateway -->
  <line x1="190" y1="90" x2="422" y2="90" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-slate)"/>
  <text x="306" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#475569">HTTP (synchronous)</text>

  <!-- Gateway -> User Service -->
  <path d="M 470 140 L 470 200 L 230 200 L 230 312" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-slate)"/>
  <text x="350" y="192" text-anchor="middle" font-size="12" fill="#475569">HTTP proxy</text>

  <!-- Gateway -> Notification Service -->
  <path d="M 560 140 L 560 200 L 770 200 L 770 312" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-slate)"/>
  <text x="650" y="192" text-anchor="middle" font-size="12" fill="#475569">HTTP proxy</text>

  <!-- User Service -> RabbitMQ (publish) -->
  <path d="M 300 392 L 300 430 L 420 430 L 420 462" fill="none" stroke="#ea580c" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-orange)"/>
  <text x="330" y="422" text-anchor="middle" font-size="12" font-weight="bold" fill="#9a3412">publishes user.created</text>

  <!-- RabbitMQ -> Notification Service (consume) -->
  <path d="M 625 500 L 748 392" fill="none" stroke="#ea580c" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-orange)"/>
  <text x="668" y="450" text-anchor="middle" font-size="12" font-weight="bold" fill="#9a3412">consumes event (async)</text>

  <!-- User Service -> MongoDB -->
  <line x1="230" y1="392" x2="230" y2="692" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-slate)"/>
  <text x="240" y="545" font-size="12" fill="#475569">reads / writes</text>

  <!-- Notification Service -> MongoDB -->
  <line x1="770" y1="392" x2="770" y2="692" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-slate)"/>
  <text x="690" y="545" font-size="12" fill="#475569">reads / writes</text>
</svg>